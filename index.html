<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%230d1117%27%2F%3E%3Crect%20x%3D%277%27%20y%3D%2715%27%20width%3D%2718%27%20height%3D%273%27%20fill%3D%27%233B9EFF%27%2F%3E%3C%2Fsvg%3E">
<title>Clearline</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
 padding:32px 24px;background:#f4f5f7;
 font:400 16px/1.6 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#4a5462}
.card{width:100%;max-width:460px;padding:40px 36px;background:#fff;border:1px solid #e3e6ea;
 border-top:3px solid #3B9EFF;box-shadow:0 12px 40px rgba(18,21,26,.07)}
.brand{margin:0 0 22px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8b95a6}
h1{margin:0 0 12px;font-size:26px;line-height:1.2;letter-spacing:-.02em;color:#12151a;font-weight:700;text-wrap:balance}
p{margin:0 0 24px}
a{display:inline-block;padding:12px 20px;background:#0d1117;color:#fff;
 text-decoration:none;font-weight:600;font-size:15px;transition:background .15s ease}
a:hover{background:#1c2430}
a:focus-visible{outline:3px solid #3B9EFF;outline-offset:3px}
@media(max-width:480px){.card{padding:32px 24px}}
</style>
</head>
<body>
<main class="card">
  <p class="brand">Clearline</p>
  <h1>Preview sites</h1>
  <p>Preview sites live under their own paths. Nothing here is indexed.</p>
  <a href="https://clearlineweb.us">Go to Clearline</a>
</main>
</body>
</html>
