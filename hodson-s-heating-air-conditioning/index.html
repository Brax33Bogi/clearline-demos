<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Loading</title>
<style>html,body{margin:0;height:100%}
#cl-boot{font:400 15px/1.6 system-ui,-apple-system,sans-serif;color:#5a6472;
display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center}</style>
</head>
<body>
<div id="cl-boot">Loading&hellip;</div>
<script>
(function(){
  var STORE='https://fusyxkmgzretrkcyyacs.supabase.co/storage/v1/object/public/demos/';
  var parts=location.pathname.replace(/^\/clearline-demos\/?/,'').split('/').filter(Boolean);
  var slug=parts[0]||'';
  if(!/^[a-z0-9][a-z0-9-]{0,120}$/i.test(slug)){document.getElementById('cl-boot').textContent='Nothing here.';return;}
  fetch(STORE+slug+'/index.html',{cache:'force-cache'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
    .then(function(html){
      var base=STORE+slug+'/';
      if(!/<base\s/i.test(html)){
        html=/<head[^>]*>/i.test(html)
          ? html.replace(/<head([^>]*)>/i,'<head$1><base href="'+base+'">')
          : '<base href="'+base+'">'+html;
      }
      document.open();document.write(html);document.close();
    })
    .catch(function(){
      document.getElementById('cl-boot').innerHTML='<div><strong style="display:block;font-size:19px;color:#12151a;margin-bottom:6px">Nothing here yet</strong>This preview is not available.</div>';
    });
})();
</script>
</body>
</html>
